server:
  port: 8080

spring:
  application:
    name: whistleblower
  main:
    # 默认开启 Web 服务，便于本地或服务器随时通过浏览器查看前端仪表盘
    # （在 GitHub Actions 批处理时会通过命令行参数覆盖为 none）
    web-application-type: servlet

whistleblower:
  # 监控的开源项目列表 (格式: owner/repo)
  monitored-repos:
    - spring-projects/spring-boot
    - alibaba/nacos
    - apache/dubbo
    - kubernetes/kubernetes
    - redis/redis
  # 报表输出目录
  output-dir: reports
  # 是否在检查完毕后自动生成 Markdown 日报
  generate-report: true

version: '3.8'

services:
  whistleblower:
    # 优先拉取 GitHub Actions 自动构建好的多架构官方镜像
    image: ghcr.io/fengyaocheng/whistleblower:latest
    # 如果本地想手动重新编译，也可以指定 build
    build: .
    container_name: whistleblower
    restart: unless-stopped
    ports:
      - "18088:18088"
    volumes:
      # 持久化存储生成的 Markdown 报表至服务器宿主机目录
      - ./reports:/app/reports
    environment:
      - TZ=Asia/Shanghai
      # 可选：配置 GitHub Token 提高 API 调用限额
      # - GITHUB_TOKEN=ghp_xxxxxx

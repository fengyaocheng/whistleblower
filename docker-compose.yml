version: '3.8'

services:
  whistleblower:
    build: .
    image: whistleblower:latest
    container_name: whistleblower
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 持久化存储生成的 Markdown 报表至服务器宿主机目录
      - ./reports:/app/reports
    environment:
      - TZ=Asia/Shanghai
      # 可选：如果希望不受 GitHub 匿名调用频率限制，可在此填入 GitHub Token
      # - GITHUB_TOKEN=ghp_xxxxxx

name: Manual Whistle & Build

on:
  # 已根据需求停用定时任务，不再消耗任何 GitHub 自动化算力额度
  # schedule:
  #   - cron: '15 2 * * *'
  workflow_dispatch: # 仅保留手动测试触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  inspect-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Whistleblower
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 开始构建并执行吹哨人巡检任务..."
          mvn compile exec:java -Dexec.mainClass="com.github.fengyaocheng.whistleblower.WhistleblowerApplication" -Dexec.args="--whistleblower.cli-mode=true"

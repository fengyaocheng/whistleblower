name: Daily Whistle & Auto-Commit

on:
  schedule:
    # 每天北京时间上午 10:15 自动运行 (对应 UTC 02:15)
    - cron: '15 2 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮触发

permissions:
  contents: write # 赋予 Actions 写入和提交推送代码的权限
  pages: write    # 赋予部署 GitHub Pages 的权限
  id-token: write

jobs:
  inspect-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Whistleblower (Batch Mode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 开始构建并执行吹哨人巡检任务..."
          mvn compile exec:java -Dexec.mainClass="com.github.fengyaocheng.whistleblower.WhistleblowerApplication" -Dexec.args="--whistleblower.cli-mode=true"

      - name: Commit and Push Daily Report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(report): auto-generate daily open-source intel report [skip ci]"
          file_pattern: "reports/*.md"
          commit_user_name: "whistleblower-bot"
          commit_user_email: "actions@github.com"
          commit_author: "Whistleblower Bot <actions@github.com>"
